<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 640" width="884" height="640" role="img" aria-label="Rhizo architecture">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1e293b; dominant-baseline: central; text-anchor: middle; }
  .title { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; fill: #64748b; text-anchor: start; }
  .hostgroup { fill: #f5f9ff; stroke: #93c5fd; }
  .hosttitle { fill: #2563eb; }
  .sandbox { fill: #f0fdf4; stroke: #86efac; }
  .halgroup { fill: #faf5ff; stroke: #d8b4fe; }
  .host { fill: #eff6ff; stroke: #60a5fa; }
  .android { fill: #dcfce7; stroke: #22c55e; }
  .hal { fill: #f3e8ff; stroke: #a855f7; }
  .entry { fill: #2563eb; stroke: #1d4ed8; }
  .aentry { fill: #16a34a; stroke: #15803d; }
  .entry + text, .aentry + text { fill: #ffffff; font-weight: 600; }
  .edge { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
  .arrow { fill: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e8f0; }
    .title { fill: #94a3b8; }
    .hostgroup { fill: #0b1730; stroke: #1e40af; }
    .hosttitle { fill: #60a5fa; }
    .sandbox { fill: #052e16; stroke: #166534; }
    .halgroup { fill: #2e1065; stroke: #6b21a8; }
    .host { fill: #172554; stroke: #3b82f6; }
    .android { fill: #14532d; stroke: #22c55e; }
    .hal { fill: #3b0764; stroke: #a855f7; }
    .edge { stroke: #64748b; }
    .arrow { fill: #64748b; }
  }
</style>
