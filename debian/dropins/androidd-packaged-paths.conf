[Unit]
ConditionPathExists=
ConditionPathExists=/usr/lib/rhizo/launcher3.py

[Service]
EnvironmentFile=
EnvironmentFile=-/etc/rhizo/androidd.env
EnvironmentFile=-/var/lib/rhizo/androidd-runtime.env
EnvironmentFile=-/var/lib/rhizo/host-mode-kept.env
ExecStartPre=/usr/lib/rhizo/tools/kernel-check.sh
ExecStart=
ExecStart=/usr/bin/python3 /usr/lib/rhizo/launcher3.py selinux_setup
ExecStop=
ExecStop=/usr/bin/python3 /usr/lib/rhizo/launcher3.py androidd-stop
ExecStopPost=
ExecStopPost=/usr/bin/python3 /usr/lib/rhizo/launcher3.py release-staging
StandardOutput=append:/var/log/rhizo/boot.log
StandardError=append:/var/log/rhizo/boot.log
