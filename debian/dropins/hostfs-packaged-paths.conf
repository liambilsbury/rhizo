[Unit]
ConditionPathExists=
ConditionPathExists=/etc/rhizo/hostfs.conf
ConditionPathExists=/usr/lib/rhizo/tools/hostfs.py

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/lib/rhizo/tools/hostfs.py attach \
    --config /etc/rhizo/hostfs.conf --wait-for-storage 180
ExecStop=
ExecStop=-/usr/bin/python3 /usr/lib/rhizo/tools/hostfs.py detach --all
